<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sinh viên - Lab 03</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <h2 class="text-center text-primary mb-4 fw-bold">QUẢN LÝ SINH VIÊN (LAB 03 - PHẦN B)</h2>

    <!-- FORM THÊM MỚI -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white fw-bold">Thêm Sinh Viên Mới</div>
        <div class="card-body">
            <form th:action="@{/students/add}" th:object="${newStudent}" method="post" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Mã SV:</label>
                    <input type="text" th:field="*{studentCode}" class="form-control" placeholder="SV011" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Họ và tên:</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Email:</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="a@gmail.com" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">SĐT:</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="0901234567">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Lớp:</label>
                    <input type="text" th:field="*{className}" class="form-control" placeholder="C2024A">
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success px-4">Lưu Sinh Viên</button>
                </div>
            </form>
        </div>
    </div>

    <!-- KHUNG TÌM KIẾM -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/students}" method="get" class="d-flex gap-2">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên, mã SV, email hoặc SĐT để tìm...">
                <button type="submit" class="btn btn-primary px-4">Tìm</button>
                <a th:href="@{/students}" class="btn btn-secondary">Tất cả</a>
            </form>
        </div>
    </div>

    <!-- BẢNG DANH SÁCH SINH VIÊN -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
            <span>Danh Sách Sinh Viên</span>
            <a href="/students/admin" class="btn btn-warning btn-sm text-dark fw-bold">Chuyển sang AdminLTE (Phần C)</a>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover m-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Mã SV</th>
                        <th>Họ và Tên</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                        <th>Lớp</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${students}">
                        <td class="fw-bold" th:text="${s.studentCode}"></td>
                        <td th:text="${s.fullName}"></td>
                        <td th:text="${s.email}"></td>
                        <td th:text="${s.phone}"></td>
                        <td th:text="${s.className}"></td>
                        <td class="text-center">
                            <a th:href="@{/students/delete/{id}(id=${s.id})}" 
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này?');">Xóa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center text-muted py-3">Không có sinh viên nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
